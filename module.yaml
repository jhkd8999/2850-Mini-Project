product: jvm/app

settings:
  ktor: enabled

  kotlin:
    serialization: json

  jvm:
    mainClass: org.jetbrains.amper.ktor.ApplicationKt

dependencies:
  - $ktor.server.core
  - $ktor.server.netty
  - $ktor.server.configYaml
  - $ktor.server.pebble
  - $ktor.server.auth
  - $ktor.server.sessions
  - $ktor.serialization.kotlinx.json

  - ch.qos.logback:logback-classic:1.5.18

  - org.jetbrains.exposed:exposed-core:0.61.0
  - org.jetbrains.exposed:exposed-dao:0.61.0
  - org.jetbrains.exposed:exposed-jdbc:0.61.0
  - org.xerial:sqlite-jdbc:3.50.3.0

  - org.apache.commons:commons-csv:1.14.1

test-dependencies:
  - $ktor.server.testHost
  - org.jetbrains.kotlin:kotlin-test